<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Animal Cell AR</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        #status {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 9999;

            background: black;
            color: white;

            padding: 10px 15px;

            font-family: Arial;
            font-size: 18px;

            border-radius: 8px;
        }
    </style>
</head>

<body style="margin: 0; overflow: hidden;">

    <div id="status">
        Looking for Hiro marker...
    </div>

    <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
>

    <!-- LIGHTING -->
    <a-light
        type="ambient"
        intensity="2">
    </a-light>

    <a-light
        type="directional"
        position="2 4 2"
        intensity="3">
    </a-light>


    <!-- HIRO MARKER -->
    <a-marker
        preset="hiro"
        id="hiroMarker"
    >

        <!-- ANIMAL CELL -->
        <a-entity
            id="animalCell"
            position="0 0 0"
            rotation="0 0 0"
        >

            <a-entity
                gltf-model="animal_cell.glb"
                position="0 -0.7 0"
                scale="0.012 0.012 0.012"
                rotation="90 0 0">
            </a-entity>

        </a-entity>

    </a-marker>

    <a-entity camera></a-entity>

</a-scene>
    <script>

        const marker = document.querySelector("#hiroMarker");
        const status = document.querySelector("#status");

        marker.addEventListener("markerFound", function () {

            status.innerHTML = "✅ ANIMAL CELL DETECTED!";

        });

        marker.addEventListener("markerLost", function () {

            status.innerHTML = "Looking for Hiro marker...";

        });

    </script>

</body>
</html>
